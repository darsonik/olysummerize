name: Dependency security checks
on:
  push:
    branches:
      - codex/fix-dependency-security-20260914
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/dependency-security.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and patch the npm lockfile
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit resolved lockfile to the fix branch
        if: github.event_name == 'push'
        run: |
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: regenerate patched npm lockfile'
            git push
          fi
      - name: Check frontend dependencies and build
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=low
          npm run build
      - name: Check backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -r backend/requirements.txt
          pip-audit -r backend/requirements.txt
          python -m compileall -q backend/app.py
